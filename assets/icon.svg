<!--
  TELL Launcher 应用图标设计源。
  渲染管线见 render_icon.py（Pillow 离线生成 app.png / app.ico），
  两者几何与配色保持一致，改设计时两处同步。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- 底板：比窗口底色略亮的蓝灰渐变，Steam 暗色同源 -->
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E4A63" />
      <stop offset="1" stop-color="#17222E" />
    </linearGradient>
    <!-- 顶部高光：模拟界面里卡片的受光面 -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.13" />
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <!-- 纸飞机上翼：强调色亮面 -->
    <linearGradient id="wingTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9BDCFF" />
      <stop offset="1" stop-color="#56ADF0" />
    </linearGradient>
    <!-- 纸飞机下翼：折纸暗面 -->
    <linearGradient id="wingBottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4791D2" />
      <stop offset="1" stop-color="#2B6BA6" />
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#tile)" />
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#sheen)" />
  <rect x="17.5" y="17.5" width="477" height="477" rx="102.5"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="3" />

  <!-- 动势尾迹 -->
  <g stroke="#9BDCFF" stroke-width="14" stroke-linecap="round" fill="none">
    <line x1="36" y1="186" x2="78" y2="186" stroke-opacity="0.28" />
    <line x1="24" y1="256" x2="86" y2="256" stroke-opacity="0.45" />
    <line x1="36" y1="326" x2="78" y2="326" stroke-opacity="0.28" />
  </g>

  <!-- 纸飞机：沿中线折开的两个翼面 -->
  <polygon points="421,256 106,121 106,226 331,256" fill="url(#wingTop)" />
  <polygon points="421,256 331,256 106,286 106,391" fill="url(#wingBottom)" />
</svg>
